name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Shows which Python commands this runner has, since the mod looks for python3, then python.
      - name: Show the Python commands on this runner
        shell: bash
        run: |
          for name in python3 python; do
            printf '%s: ' "$name"
            "$name" --version 2>&1 || echo "not found"
          done

      - name: Install the Claude Code CLI the mod is tested with
        run: npm install -g @anthropic-ai/claude-code@2.1.299

      - name: Validate the manifest and hooks
        run: claude plugin validate .

      - name: Run the mod's tests
        run: claude plugin test

      - name: Run the scanner's tests
        run: python -m unittest discover -s hooks -p "test_*.py"

      - name: Check the package and plugin versions agree
        shell: bash
        run: |
          node -e "const a = require('./package.json').version, b = require('./.claude-plugin/plugin.json').version; if (a !== b) { console.error('package.json ' + a + ' and plugin.json ' + b + ' differ'); process.exit(1) }"

      - name: Check the installer prints its command
        shell: bash
        run: node bin/install.js --print

      - name: Check the illustrations match their scripts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node docs/gen-visuals.mjs
          node docs/collect-desktop.mjs
          node docs/render-desktop.mjs
          git diff --exit-code -- docs/
